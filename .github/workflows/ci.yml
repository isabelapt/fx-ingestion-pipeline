name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Pytest with Coverage
        run: uv run pytest --cov=src --cov-report=term-missing

  terraform-checks:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Fmt
        run: |
          cd infra/terraform
          terraform fmt -check -diff -recursive

      - name: Terraform Init & Validate
        run: |
          cd infra/terraform
          terraform init -backend=false -input=false
          terraform validate

  deploy-infrastructure:
    name: Provision AWS S3 via Terraform (OIDC)
    needs: [python-tests, terraform-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACTIONS_STEP_DEBUG: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Debug GitHub Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Inspect OIDC token
        run: |
          TOKEN=$(curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          RAW_JWT=$(echo "$TOKEN" | cut -d "." -f2)
          PADDED_JWT=$(echo -n "$RAW_JWT" | awk '{ if (length($0) % 4 == 2) print $0"=="; else if (length($0) % 4 == 3) print $0"="; else print $0 }')
          echo "$PADDED_JWT" | base64 -d | jq || echo "Could not decode or parse OIDC token"

      - name: Validate required CI variables
        run: |
          test -n "${{ secrets.AWS_ROLE_ARN }}" || { echo "AWS_ROLE_ARN is not set"; exit 1; }

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: "us-east-1"
          audience: "sts.amazonaws.com"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Plan
        env:
          TF_IN_AUTOMATION: true
          TF_LOG: INFO
          TF_LOG_PATH: terraform.log
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd infra/terraform
          terraform version
          terraform init -input=false -upgrade
          terraform validate
          terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        env:
          TF_IN_AUTOMATION: true
          TF_LOG: INFO
          TF_LOG_PATH: terraform.log
        run: |
          cd infra/terraform
          terraform apply -input=false -auto-approve tfplan

      - name: Upload Terraform Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-log
          path: infra/terraform/terraform.log
          retention-days: 5

